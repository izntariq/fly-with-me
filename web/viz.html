<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Brain Visualiser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<style>
:root {
  --bg: #030407; --text: #e6ebf5; --dim: #8a93a8; --line: rgba(255,255,255,.09);
  --panel: rgba(10,12,18,.62); --a: #35e0c2; --b: #ff5ca8; --hot: #fff36b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { cursor: grab; touch-action: none; }
#hud { pointer-events: none; }
#tip { position: fixed; display: none; max-width: 290px; padding: 7px 10px; border-radius: 8px; pointer-events: none;
  background: rgba(10,12,18,.88); border: 1px solid var(--line); font-size: 11px; line-height: 1.45; z-index: 5; }
#tip b { color: #fff; }

#side { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); width: 300px; max-height: calc(100% - 32px);
  overflow: hidden; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity .35s, transform .35s; }
#side.hidden { opacity: 0; transform: translate(24px, -50%); pointer-events: none; }
.top { margin-bottom: 8px; }
.brand { display: block; letter-spacing: .22em; font-weight: 700; font-size: 11px; white-space: nowrap; }
.dim { color: var(--dim); }
#stat { display: block; font-size: 10px; margin-top: 1px; }

.decks { margin-bottom: 10px; }
.deck { display: flex; gap: 6px; align-items: baseline; color: var(--dim); white-space: nowrap; }
.deck .l { font-weight: 700; width: 12px; }
.deck .tn { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.deck.on { color: var(--text); }
.deck.on .tn::before { content: "▶ "; font-size: 9px; }
.xf { position: relative; height: 3px; margin: 6px 0 0; border-radius: 2px;
  background: linear-gradient(90deg, var(--a), #333a48 45%, #333a48 55%, var(--b)); }
.xf i { position: absolute; top: -3px; width: 3px; height: 9px; margin-left: -1px; background: #fff; border-radius: 1px; }

.card { position: relative; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.035); }
.card .lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.card .mv { font-size: 22px; font-weight: 800; letter-spacing: .03em; line-height: 1.15; margin: 3px 0 4px; text-transform: uppercase; }
.card .who { color: #c4cbda; font-size: 11px; min-height: 2.8em; }
.card .who b { color: var(--text); }
.card .meter { height: 3px; margin-top: 7px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; }
.card .meter i { display: block; height: 100%; width: 0; border-radius: 2px; transition: width .4s; }
.card .lands { margin-top: 6px; font-size: 11px; font-weight: 700; min-height: 1.4em; }
.card.hit { animation: hit .7s ease-out; }
@keyframes hit { 0% { transform: scale(1.05); box-shadow: 0 0 34px var(--c); border-color: var(--c); } 100% { transform: scale(1); box-shadow: 0 0 0 transparent; } }

.next { margin: 10px 0 2px; font-size: 11px; min-height: 1.4em; }
.next .bar { height: 2px; margin-top: 4px; background: rgba(255,255,255,.07); }
.next .bar i { display: block; height: 100%; }

ol#hist { list-style: none; margin: 10px 0 0; padding: 0; }
#hist li { display: flex; gap: 7px; align-items: baseline; padding: 3px 0; border-top: 1px solid var(--line); white-space: nowrap; }
#hist li i { flex: none; width: 7px; height: 7px; border-radius: 50%; transform: translateY(-1px); }
#hist li b { font-weight: 600; }
#hist li span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; flex: 1; font-size: 11px; }
#hist li em { color: var(--dim); font-style: normal; font-size: 10px; }
.tick { margin-top: 10px; font-size: 10.5px; color: var(--dim); max-height: 4.2em; overflow: hidden; }
.tick b { color: #c4cbda; font-weight: 600; }
.keys { margin-top: 8px; font-size: 10px; }

#msg { position: fixed; left: 16px; bottom: 14px; color: var(--dim); font-size: 11px; }
@media (max-width: 640px) {
  #side { width: auto; left: 16px; right: 16px; top: auto; bottom: 16px; transform: none; max-height: 45%; }
  #side.hidden { transform: translateY(24px); }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<aside id="side">
  <div class="top"><span class="brand">FLY BRAIN DJ</span><span id="stat" class="dim">connecting…</span></div>
  <div class="decks" id="decks"></div>
  <div class="card" id="card">
    <div class="lbl" id="mv-lbl">the fly is doing</div>
    <div class="mv" id="mv-name">—</div>
    <div class="who" id="mv-who">waiting for its first move</div>
    <div class="meter"><i id="mv-int"></i></div>
    <div class="lands" id="mv-lands"></div>
  </div>
  <div class="next" id="next"></div>
  <ol id="hist"></ol>
  <div class="tick" id="tick"></div>
  <div class="keys dim">drag to turn · scroll to zoom · click a neuron to stimulate it<br>H hide panel · F full screen · double-click to reset</div>
</aside>
<div id="msg"></div>
<div id="tip"></div>
<script type="module" src="js/visualiser.js"></script>
</body>
</html>
